name: Release
on:
  push:
    tags:
      - >-
        v*.*.*
permissions:
  id-token: write # Required for OIDC
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['latest']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Derive release version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Sync package version to tag
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Build package
        run: npm run build --if-present

      - name: Publish package to npm
        run: npm publish

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tagName = process.env.TAG_NAME

            const allTags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            })

            const releaseTags = allTags
              .map((tag) => tag.name)
              .filter((name) => /^v\d+\.\d+\.\d+$/.test(name) && name !== tagName)

            const previousTagName = releaseTags[0]

            const notes = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tagName,
              previous_tag_name: previousTagName,
            })

            core.setOutput('body', notes.data.body)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
