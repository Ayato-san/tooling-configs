name: Release
on:
  push:
    tags:
      - >-
        v*.*.*
permissions:
  id-token: write # Required for OIDC
  contents: write # Required to push the release commit
jobs:
  release:
    if: github.event.created == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Derive release version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Sync package version to tag
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Build package
        run: npm run build --if-present

      - name: Publish package to npm
        run: npm publish

      - name: Commit release version
        id: release_commit
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- package.json; then
            release_commit_sha="$(git rev-parse HEAD)"
            tag_updated='false'
          else
            git add package.json
            git commit -m "ci(release): sync package version to ${TAG_NAME}"

            git tag -fa "$TAG_NAME" -m "$TAG_NAME"
            git push origin "refs/tags/$TAG_NAME" --force

            release_commit_sha="$(git rev-parse HEAD)"
            tag_updated='true'
          fi

          echo "release_commit_sha=$release_commit_sha" >> "$GITHUB_OUTPUT"
          echo "tag_updated=$tag_updated" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_COMMITISH: ${{ steps.release_commit.outputs.release_commit_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const { owner, repo } = context.repo
            const tagName = process.env.TAG_NAME
            const targetCommitish = process.env.TARGET_COMMITISH
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))

            const allTags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            })

            const releaseTags = allTags
              .map((tag) => tag.name)
              .filter((name) => /^v\d+\.\d+\.\d+$/.test(name) && name !== tagName)

            const previousTagName = releaseTags[0]
            const compareUrl = previousTagName
              ? `https://github.com/${owner}/${repo}/compare/${previousTagName}...${tagName}`
              : null

            let commits = []

            if (previousTagName) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTagName}...${targetCommitish}`,
              })

              commits = comparison.data.commits
            } else {
              const commitList = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: targetCommitish,
                per_page: 1,
              })

              commits = commitList.data
            }

            const commitLines = commits.map((commit) => {
              const summary = commit.commit.message.split('\n')[0].trim()
              const shortSha = commit.sha.slice(0, 7)

              return `- ${summary} ([${shortSha}](${commit.html_url}))`
            })

            const body = [
              `NPM release [here](https://npmx.dev/package/${packageJson.name}/v/${packageJson.version})`,
              '',
              ...(compareUrl ? [`**Full Changelog**: ${compareUrl}`, ''] : []),
              '',
              ...(commitLines.length > 0 ? commitLines : ['- Initial release']),
            ].join('\n')

            core.setOutput('body', body)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ steps.release_commit.outputs.release_commit_sha }}
          body: ${{ steps.release_notes.outputs.body }}
